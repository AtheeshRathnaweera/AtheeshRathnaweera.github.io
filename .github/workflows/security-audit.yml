name: Security Audit

on:
  pull_request:
  push:
    branches: ["master", "dev"]
  # Weekly run catches new advisories even when nobody is pushing code.
  # A failed scheduled run emails the repo owner.
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: "npm"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Full report (warning only)
        run: node scripts/check-vulnerabilities.mjs --level=moderate
      - name: Fail on high/critical in production dependencies
        run: npm run check-vulnerabilities:ci
